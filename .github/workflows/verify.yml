name: Verify build and robotics contracts
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Install headless MuJoCo rendering libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgles2 libgl1-mesa-dri
      - run: python -m pytest tests/test_backend.py -q
